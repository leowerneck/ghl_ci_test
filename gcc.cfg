# Einstein Toolkit Configuration for Ubuntu 24-04.
# Installed packages:
#   - cmake
#   - curl
#   - g++
#   - gcc
#   - gfortran
#   - git
#   - libfftw3-dev
#   - libgsl-dev
#   - libhdf5-dev
#   - libhdf5-openmpi-dev
#   - libhwloc-dev
#   - libjpeg-dev
#   - liblapack-dev
#   - libopenmpi-dev
#   - libpapi-dev
#   - libssl-dev
#   - libudev-dev
#   - libyaml-cpp-dev
#   - make
#   - numactl
#   - patch
#   - pkg-config
#   - python3
#   - python3-pip
#   - python-is-python3
#   - rsync
#
# See Dockerfile for additional information.
VERSION = 2026-06-09

CPP = cpp
FPP = cpp
CC  = gcc
CXX = g++
F77 = gfortran
F90 = gfortran

CPPFLAGS = -DMPICH_IGNORE_CXX_SEEK -D_XOPEN_SOURCE -D_XOPEN_SOURCE_EXTENDED
FPPFLAGS = -traditional
CFLAGS   = -O0 -std=c99
CXXFLAGS = -O0 -std=c++17
F77FLAGS = -O0 -fcray-pointer -ffixed-line-length-none -fno-range-check
F90FLAGS = -O0 -fcray-pointer -ffixed-line-length-none -fno-range-check
LDFLAGS  = -rdynamic
MPI_LIBS = mpi

LIBDIRS =

C_LINE_DIRECTIVES = yes
F_LINE_DIRECTIVES = yes

OPTIMISE       = no
PROFILE        = no
DEBUG          = yes
OPENMP         = yes
WARN           = yes
CPP_WARN_FLAGS = -Wall
FPP_WARN_FLAGS = -Wall
C_WARN_FLAGS   = -Wall
CXX_WARN_FLAGS = -Wall
F77_WARN_FLAGS = -Wall
F90_WARN_FLAGS = -Wall
